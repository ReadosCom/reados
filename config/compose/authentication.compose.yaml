services:
  authentication:
    build:
      context: ../..
      dockerfile: ./config/compose/authentication.dockerfile
    env_file:
      - ./authentication.env
    environment:
      COVERAGE: ${COVERAGE:-}
      ROOT_FQDN: ${ROOT_FQDN:-reados.localhost}
    volumes:
      - ../..:/app
      - authentication_node_modules:/app/node_modules
    networks:
      - reados
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.docker.network: reados
      traefik.http.routers.authentication.rule: HostRegexp(`^authentication\.[a-z0-9-]+\.reados\.localhost$`)
      traefik.http.routers.authentication.entrypoints: web
      traefik.http.routers.authentication.priority: "100"
      traefik.http.services.authentication.loadbalancer.server.port: "3000"
