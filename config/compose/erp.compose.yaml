services:
  erp:
    build:
      context: ../..
      dockerfile: ./config/compose/erp.dockerfile
    env_file:
      - ./erp.env
    environment:
      COVERAGE: ${COVERAGE:-}
      ROOT_FQDN: ${ROOT_FQDN:-reados.localhost}
    volumes:
      - ../..:/app
      - erp_node_modules:/app/node_modules
    networks:
      - reados
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.docker.network: reados
      traefik.http.routers.erp.rule: HostRegexp(`^erp\.[a-z0-9-]+\.${ROOT_FQDN:-reados.localhost}$`)
      traefik.http.routers.erp.entrypoints: web
      traefik.http.routers.erp.priority: "100"
      traefik.http.services.erp.loadbalancer.server.port: "3000"
