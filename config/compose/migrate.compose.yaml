services:
  migration:
    build:
      context: .
      dockerfile: ./config/compose/server.dockerfile
    env_file:
      - ./config/compose/migrate.env
      - ./config/compose/postgres.env
    entrypoint: ["npm", "run", "migrate", "--"]
    volumes:
      - .:/app
      - migration_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - reados

volumes:
  migration_node_modules:
