services:
  core:
    build:
      context: ../..
      dockerfile: ./config/compose/core.dockerfile
    env_file:
      - ./core.env
    environment:
      COVERAGE: ${COVERAGE:-}
      ROOT_FQDN: ${ROOT_FQDN:-reados.localhost}
    volumes:
      - ../..:/app
      - core_node_modules:/app/node_modules
    networks:
      - reados
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.docker.network: reados
      traefik.http.routers.core.rule: HostRegexp(`^core\.[a-z0-9-]+\.${ROOT_FQDN:-reados.localhost}$`)
      traefik.http.routers.core.entrypoints: web
      traefik.http.routers.core.priority: "100"
      traefik.http.services.core.loadbalancer.server.port: "3000"
