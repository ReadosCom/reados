name: PR Tests

on:
  pull_request:

concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PR Checks and E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run code checks
        env:
          CI: true
        run: npm run check

      - name: Initialize local env files
        run: bash ./scripts/start-here.sh --no-questions

      - name: Verify Chrome availability
        run: |
          google-chrome --version

      - name: Run tests
        env:
          CI: true
        run: npm test
