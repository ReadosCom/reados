name: PR Tests

on:
  pull_request:

concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PR Checks and E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run code checks
        env:
          CI: true
        run: npm run check

      - name: Initialize local env files
        run: bash ./scripts/start-here.sh --no-questions

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chrome
        run: |
          for attempt in 1 2 3; do
            echo "Playwright install attempt ${attempt}"
            if timeout 15m npx playwright install --with-deps chrome; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Install attempt ${attempt} failed or timed out, retrying..."
              sleep 15
            fi
          done

          echo "Playwright browser install failed after 3 attempts."
          exit 1

      - name: Run tests
        env:
          CI: true
        run: npm test
